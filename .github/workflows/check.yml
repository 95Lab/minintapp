name: Check and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Do not interrupt a deployment halfway through replacing its container.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:local && npm run env:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate deploy scripts
        run: bash -n deploy/deploy.sh scripts/deploy-runner.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  image:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: name
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: minintapp:test
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Docker Compose
        env:
          APP_ORIGIN: http://localhost
          MININTAPP_IMAGE: minintapp:test
        run: |
          touch deploy/.env.app
          docker compose -f deploy/compose.yml config --quiet
      - name: Test running image
        run: |
          docker run --detach --name minintapp-test --publish 127.0.0.1:3200:3000 minintapp:test
          SMOKE_BASE_URL=http://127.0.0.1:3200 node scripts/deploy-smoke.mjs
      - name: Container diagnostics
        if: failure()
        run: docker logs minintapp-test || true
      - name: Stop test container
        if: always()
        run: docker rm -f minintapp-test || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish the exact image that passed smoke tests
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
        run: |
          image_tag="$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag minintapp:test "$image_tag"
          docker push "$image_tag"
          reference=$(docker inspect --format='{{index .RepoDigests 0}}' "$image_tag")
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, minintapp-production]
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy on this runner machine
        env:
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash scripts/deploy-runner.sh
