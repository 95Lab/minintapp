name: Check and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Do not interrupt a deployment halfway through replacing its container.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:local && npm run env:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate deploy scripts
        run: bash -n deploy/deploy.sh scripts/deploy-runner.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minintapp
          POSTGRES_PASSWORD: local-integration-only
          POSTGRES_DB: minintapp_test
        ports: ["15439:5432"]
        options: --health-cmd "pg_isready -U minintapp -d minintapp_test" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["16389:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:platform
  image:
    needs: [check, platform]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install smoke-test dependencies
        run: npm ci
      - id: name
        name: Image name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: minintapp:test
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Docker Compose
        env:
          APP_ORIGIN: http://localhost
          MININTAPP_IMAGE: minintapp:test
        run: |
          touch deploy/.env.app
          docker compose -f deploy/compose.yml config --quiet
      - name: Test running image
        run: |
          docker run --detach --name minintapp-test --publish 127.0.0.1:3200:3000 minintapp:test
          SMOKE_BASE_URL=http://127.0.0.1:3200 node scripts/deploy-smoke.mjs
      - name: Test independent SQLite runtimes
        env:
          LOCAL_RUNTIME_IMAGE: minintapp:test
        run: npx tsx platform/runtime-smoke.ts
      - name: Container diagnostics
        if: failure()
        run: docker logs minintapp-test || true
      - name: Stop test container
        if: always()
        run: docker rm -f minintapp-test || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        name: Publish the exact image that passed smoke tests
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
        run: |
          image_tag="$IMAGE_NAME:sha-$GITHUB_SHA"
          docker tag minintapp:test "$image_tag"
          docker push "$image_tag"
          reference=$(docker inspect --format='{{index .RepoDigests 0}}' "$image_tag")
          digest="${reference#*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy verified image through restricted SSH command
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          IMAGE_REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$IMAGE_REF" =~ ^ghcr.io/95lab/minintapp@sha256:[a-f0-9]{64}$ ]]
          printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "deploy $IMAGE_REF"
