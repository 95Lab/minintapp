name: minintapp
services:
  app:
    image: ${MININTAPP_IMAGE:?Set an immutable application image digest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?Set the public origin without a trailing slash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:18080:3000"
    networks: [platform]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  platform:
    external: true
    name: minintapp-platform
