name: minintapp
services:
  app:
    image: ${MININTAPP_IMAGE:?Set an immutable application image digest}
    restart: unless-stopped
    init: true
    env_file:
      - .env.app
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?Set the public origin without a trailing slash}
    expose:
      - "3000"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the public origin}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
