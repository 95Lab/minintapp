# Overlay: docker compose --env-file .env.platform -f compose.yml -f platform.compose.yml up -d
services:
  app:
    env_file: !override [.env.control]
    environment:
      PLATFORM_ROLE: control
      OPENAI_API_KEY: ""
      SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ""
      RUNTIME_IMAGE: ${MININTAPP_IMAGE:?Set immutable runtime image}
      DATABASE_URL: postgresql://minintapp:${POSTGRES_PASSWORD:?Required}@postgres:5432/minintapp
      REDIS_URL: redis://:${REDIS_PASSWORD:?Required}@redis:6379
      WORKER_TOKEN: ${WORKER_TOKEN:?Required}
      IP_HASH_SALT: ${IP_HASH_SALT:?Required}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minintapp
      POSTGRES_DB: minintapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    ports: ["127.0.0.1:15432:5432", "${POSTGRES_SANDBOX_BIND_IP:?Required private bridge IP}:15432:5432"]
    volumes: ["metadata:/var/lib/postgresql/data"]
    networks: [platform]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U minintapp -d minintapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["queue:/data"]
    networks: [platform]
    mem_limit: 160m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
  objectstore:
    image: ${MININTAPP_OBJECTSTORE_IMAGE:?Set a verified MinIO image digest}
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Required}
    ports: ["127.0.0.1:19000:9000"]
    volumes: ["artifacts:/data"]
    networks: [platform]
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
volumes:
  metadata:
  queue:
  artifacts:
