<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MinintApp · Bình chọn</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body><a class="skip" href="#main">Đến nội dung chính</a><header><a href="/" class="brand">minintapp.</a><span id="status" role="status">Đang kết nối…</span></header><main id="main"><p class="eyebrow">Một lựa chọn. Cùng quyết định.</p><h1 id="title">Bình chọn của nhóm</h1><p id="description"></p><p id="expiry"></p><section id="host-panel" hidden aria-labelledby="host-title"><h2 id="host-title">Quản lý bình chọn</h2><form id="host-login"><label>Khóa quản lý<input id="host-token" type="password" required autocomplete="off"></label><button>Đăng nhập quản lý</button></form><div id="host-actions" hidden><button type="button" data-action="close">Đóng bình chọn</button><button type="button" data-action="reopen">Mở lại bình chọn</button><button id="end-request" type="button">Kết thúc và xóa phiếu</button><div id="end-confirm" hidden><p>Xóa toàn bộ phiếu và kết thúc ứng dụng? Thao tác này không thể hoàn tác.</p><button type="button" data-action="end">Xác nhận kết thúc</button><button id="end-cancel" type="button">Hủy</button></div></div></section><section id="poll" hidden><h2 id="block-title"></h2><p id="note"></p><form id="vote"><label id="name-field" hidden>Tên hiển thị<input id="display-name" maxlength="80" autocomplete="name"></label><fieldset><legend id="question"></legend><div id="options"></div></fieldset><button id="submit" type="submit">Gửi bình chọn</button></form></section><p id="message" role="status" aria-live="polite"></p><p id="error" role="alert"></p><section id="results" hidden aria-labelledby="results-title"><h2 id="results-title">Kết quả</h2><p id="total"></p><ul id="bars"></ul></section><p id="hidden-results" hidden>Kết quả chưa được công bố.</p><noscript>Bật JavaScript để tham gia bình chọn.</noscript></main><footer>MinintApp · Cho những quyết định nhỏ của cả nhóm.</footer></body></html>
